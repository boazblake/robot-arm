name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check application
        run: npm run typecheck

      - name: Verify repository cleanup
        run: npm run verify:cleanup

      - name: Scan tracked tree for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --redact --config .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web application
        run: npm run build

      - name: Verify generated Pages output
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/404.html
          test -d docs/assets
          test -f docs/ionic.esm.js
          test -f docs/index.esm.js
          test -n "$(find docs -maxdepth 1 -type f -name 'p-*.entry.js' -print -quit)"
          test -f docs/icon.svg
          echo "Web: VERIFIED"
          echo "Android: NOT VERIFIED (Android build is not executed by this workflow)"
          echo "iOS: NOT VERIFIED (native build is not run by this Linux workflow)"
          ! find docs -type f \( \
            -name '.env' \
            -o -name '.env.*' \
            -o -name '*.pem' \
            -o -name '*.key' \
            -o -path '*/node_modules/*' \
          \) -print -quit | grep -q .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
